[package]
name = "stillyard"
version = "0.1.0-alpha.6"
edition = "2024"
rust-version = "1.85"
description = "A quiet, local-first scheduler for real processes"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pyboosted/stillyard"
readme = "README.md"
keywords = ["scheduler", "process", "local-first", "gpu", "automation"]
categories = ["command-line-utilities", "development-tools"]
default-run = "stillyard"

[lib]
name = "stillyard"
path = "src/lib.rs"

[[bin]]
name = "stillyard"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
fs2 = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
schemars = { version = "1.0", features = ["uuid1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
uuid = { version = "1.18", features = ["serde", "v7"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
tempfile = "3.21"
