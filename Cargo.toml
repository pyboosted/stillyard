[package]
name = "stillyard"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
description = "A quiet, local-first scheduler for real processes"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pyboosted/stillyard"
readme = "README.md"
keywords = ["scheduler", "process", "local-first", "gpu", "automation"]
categories = ["command-line-utilities", "development-tools"]
default-run = "stillyard"

[lib]
name = "stillyard"
path = "src/lib.rs"

[[bin]]
name = "stillyard"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
schemars = { version = "1.0", features = ["uuid1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.18", features = ["serde", "v7"] }

[dev-dependencies]
tempfile = "3.21"

